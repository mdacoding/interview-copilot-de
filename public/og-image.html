<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Interview Copilot - OG Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c9d1d9;
    }
    .container {
      max-width: 1200px;
      width: 100%;
      padding: 60px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      color: white;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 72px;
      font-weight: 800;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-size: 28px;
      color: #8b949e;
      margin-bottom: 40px;
      line-height: 1.5;
    }
    .features {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }
    .feature {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px 30px;
      font-size: 18px;
      color: #c9d1d9;
    }
    .cta {
      font-size: 24px;
      color: #7c3aed;
      font-weight: 600;
    }
    .logo {
      position: absolute;
      top: 40px;
      left: 60px;
      font-size: 24px;
      font-weight: 700;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎯 AI Interview Copilot</div>
    
    <div class="badge">🚀 Product Hunt Launch</div>
    
    <h1>Land Your Dream Job</h1>
    
    <p class="tagline">
      Practice interviews with AI-powered real-time feedback.<br>
      Get STAR method suggestions and ace your next interview!
    </p>
    
    <div class="features">
      <div class="feature">🎤 Real-time AI Feedback</div>
      <div class="feature">⭐ STAR Method</div>
      <div class="feature">📄 Resume Parsing</div>
    </div>
    
    <p class="cta">Start Free →</p>
  </div>
</body>
</html>
